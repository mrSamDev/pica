# pre-commit quality gates. Install: `pre-commit install`
# Run all: `pre-commit run --all-files`
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint (oxlint + anti-slop)
        entry: pnpm lint
        language: system
        pass_filenames: false
        always_run: true
      - id: fmt
        name: format (oxfmt, printWidth 300)
        entry: pnpm fmt:check
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: test (vitest)
        entry: pnpm test
        language: system
        pass_filenames: false
        always_run: true
        # db/queue tests spin up testcontainers (postgres + redis); they skip if Docker is down.
      - id: review-gate
        name: review-gate (pi brutal review + comment validation; blocks medium/large commits with issues)
        entry: bash tools/review-gate.sh
        language: system
        pass_filenames: false
        always_run: true
        # Runs pi review on every commit. Blocks only when the staged change is
        # medium/large (>= REVIEW_THRESHOLD lines, default 200) AND the review
        # flags a blocking issue. Small commits are reviewed but never blocked.
        # Also validates added comments against AGENTS.md comment rules and
        # blocks when they violate them.
        # Env: REVIEW_THRESHOLD, REVIEW_MODEL, REVIEW_SKIP=1 to disable.
        #      COMMENT_MODEL, COMMENT_TIMEOUT for the comment review.
