# §12: VPS deployment — postgres + redis + app, with a Cloudflare Tunnel for
# webhook ingress. No ports are published: the only route in is the tunnel.
# Required values come from .env via ${VAR:?}; `docker compose up` aborts with
# a clear message if .env is incomplete. Config validation at app boot is the
# second guard.
services:
  app:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pica
      REDIS_URL: redis://redis:6379
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY}
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:?set PLATFORM_TOKEN}
      PLATFORM: ${PLATFORM:-github}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-chat-v3}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?set DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pica"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cloudflare Tunnel: remotely managed (TUNNEL_TOKEN, no config file on disk).
  # Route your public hostname to http://app:3000 in the CF dashboard.
  # Start with: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - app
    profiles:
      - tunnel
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
